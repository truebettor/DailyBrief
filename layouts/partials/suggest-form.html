<div class="suggest-form">
  <form action="https://formspree.io/f/PLACEHOLDER" method="POST">
    <label for="topic">Topic or question</label>
    <input type="text" id="topic" name="topic" placeholder="e.g. South China Sea shipping routes" required>

    <label for="context">Why it matters to NZ (optional)</label>
    <textarea id="context" name="context" placeholder="Any context on why this is relevant to a New Zealand audience..."></textarea>

    <label for="email">Your email (optional — only if you want a reply)</label>
    <input type="email" id="email" name="email" placeholder="you@example.com">

    <button type="submit">Send suggestion</button>
  </form>
</div>
